<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCF9F0"/>
      <stop offset="100%" stop-color="#F5F0E1"/>
    </linearGradient>
  </defs>
  
  <!-- Squircle container matching official app logo -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)"/>
  <rect width="128" height="128" rx="34" fill="none" stroke="#E3DCB6" stroke-width="2"/>

  <!-- Official Wordmark "Anyble" centered with Purple Spark -->
  <g transform="translate(64, 76)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-weight="900"
      font-size="28"
      fill="#111111"
      letter-spacing="-0.8"
    >
      Anyble
    </text>

    <!-- 3 Signature Purple Radiating Rays above 'e' -->
    <line x1="33" y1="-17" x2="31" y2="-25" stroke="#9333EA" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="-19" x2="40" y2="-27" stroke="#9333EA" stroke-width="3" stroke-linecap="round" />
    <line x1="43" y1="-15" x2="50" y2="-20" stroke="#9333EA" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
